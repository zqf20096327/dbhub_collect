name: nightly-collect
on:
  schedule:
    - cron: '0 16 * * *'      # UTC 16:00 = 北京 00:00，每晚
  workflow_dispatch: {}        # 支持手动触发
permissions:
  contents: write
concurrency:
  group: nightly-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: 池采集·国际（stars>=10 + 新项目窗口，断点续采）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python collect/collect_intl.py --max-calls 800

      - name: 池采集·国产（无星线，超1000按创建期拆分，断点续采）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python collect/collect_cn.py --max-calls 1000

      - name: 衔接当日池（准备 snapshot_latest）
        run: |
          mkdir -p data/snapshot_latest
          POOL=$(ls -t data/snapshot_*/pool.json 2>/dev/null | head -1)
          [ -z "$POOL" ] && { echo "无可用 pool，跳过后续"; exit 0; }
          cp "$POOL" data/snapshot_latest/pool.json

      # 顺序即配额策略：富集慢节奏(~1000/时)先行，各自吃满滚动小时窗；
      # README 是 45 分钟 3000 次的爆发(~4200/时)，放最后独占一个新小时窗，
      # 否则紧跟 README 之后会让富集立刻触到 Core 小时配额保底线（09-29 实测）
      - name: 富集（分层增量：未到期零调用，到期才采）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python enrich/enrich.py --tier all --pool data/snapshot_latest/pool.json --max-calls 5000 --max-minutes 220

      - name: README 增量（每月 1 号自动转月度全量校准）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE=weekly; [ "$(date -u +%d)" = "01" ] && MODE=monthly
          python collect/readme_sweep.py --mode "$MODE" --pool data/snapshot_latest/pool.json --max-calls 3000 --max-minutes 60

      - name: state 残渣 GC（每月 1 号）
        run: |
          d=$(date -u +%d)
          if [ "$d" = "01" ]; then
            python tools/gc_states.py --apply || echo "::warning::gc_states 失败（不影响当晚采集数据）"
          else
            echo "非月初，跳过"
          fi

      - name: 提交并推送数据
        run: |
          git config user.name "zqf20096327"
          git config user.email "zqf20096327@users.noreply.github.com"
          git add -A
          git commit -m "采集 $(date -u +%F)" || { echo "无变更"; exit 0; }
          git pull --rebase --autostash || true
          git push
