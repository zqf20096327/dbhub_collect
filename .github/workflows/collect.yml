name: nightly-collect
on:
  schedule:
    - cron: '0 16 * * *'      # 每天一窗（UTC 16 = 北京 00:00）。采集已稳定，
                              # 单 job 上限 6h、窗内自计时，跑完即收工；当窗
                              # 未跑完的量靠断点续采次日继续，不丢数据。
  workflow_dispatch:             # 手动触发（冒烟）
    inputs:
      limit:
        description: '冒烟：富集/README 各最多处理 N 个仓（0=不限；>0 时跳过池采集，看单个仓耗时）'
        default: '0'
        type: string
permissions:
  contents: write
concurrency:
  group: nightly-collect       # 两窗若重叠则排队不互杀（cancel-in-progress: false）
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360       # 平台单 job 上限即 6h，窗内预算按此自计时
    steps:
      - uses: actions/checkout@v4
        with:
          # 同 evidence.yml：排队期间 main 前进，锁触发时刻 sha 会拿旧数据白做
          ref: refs/heads/main

      - name: 记录 job 起点（供 README 步骤算剩余时间预算）
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      # T5a 绿门（2026-11-04）：attribution 引擎各卡单测并入采集前置自检链——
      # 以前只有 evidence.yml 跑 evidence 自检，引擎坏了要等下次全池扫描才发现。
      # 全部离线零 API（合成宇宙），~1 分钟；红了当晚采集停（绿门语义）。
      - name: 离线自检绿门（evidence + attribution 全家 + collect 两闸 + enrich，零 API）
        run: |
          for f in evidence/selftest_evidence.py attribution/selftest_*.py \
                   collect/selftest_exit_gate.py collect/selftest_readme_relay.py \
                   enrich/selftest_enrich.py; do
            python "$f" >/dev/null || { echo "::error::自检失败：$f"; exit 1; }
          done
          echo "12 套自检全绿"

      - name: 池采集·国际（stars>=10 + 新项目窗口，断点续采）
        if: ${{ (github.event.inputs.limit || '0') == '0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python collect/collect_intl.py --max-calls 800

      - name: 池采集·国产（无星线，超1000按创建期拆分，断点续采）
        if: ${{ (github.event.inputs.limit || '0') == '0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python collect/collect_cn.py --max-calls 1000

      - name: 衔接当日池（准备 snapshot_latest）
        run: |
          mkdir -p data/snapshot_latest
          if [ -f data/live/pool.ndjson ]; then
            python -c "import sys; sys.path.insert(0,'lib'); import pool_store; \
              recs,_ = pool_store.load_latest('pool'); import json; \
              json.dump(recs, open('data/snapshot_latest/pool.json','w',encoding='utf-8'), ensure_ascii=False)"
          else
            POOL=$(ls -t data/snapshot_*/pool.json 2>/dev/null | head -1)
            [ -z "$POOL" ] && { echo "无可用 pool，跳过后续"; exit 0; }
            cp "$POOL" data/snapshot_latest/pool.json
          fi

      # 顺序即配额策略：富集慢节奏(~1000/时)先行，各自吃满滚动小时窗；
      # README 放最后：若富集已把本小时窗 Core 用到保底线，readme_sweep 会
      # 睡到下一小时窗再续（--wait-windows，09-30 加），不再被挤成 0 完成
      - name: 富集（分层增量：未到期零调用，到期才采）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 跨小时等待：触保底线按响应头 reset 睡到下一小时窗再续（预算按窗发新，
          # 吃满 220 分钟——旧行为触线即停，49.9 分钟就收工浪费 3/4 预算）。
          # 每窗 6 个，README 预算由 REM 公式按窗内剩余时间自动分配，无需让路
          python enrich/enrich.py --tier all --pool data/snapshot_latest/pool.json --max-calls 5000 --max-minutes 220 --wait-windows 8 \
            --limit "${{ github.event.inputs.limit || '0' }}"

      # --wait-windows 10：Core 触保底线按失败响应的 X-RateLimit-Reset 睡到
      # 配额恢复再续，最多 10 次（勿用 /rate_limit 判断——Actions token 上它
      # 与真实调用不同桶，09-30 实测）；总时长用 job 剩余时间动态计算
      # （360min - 已用 - 留 10 分钟给提交），保证提交步骤必定执行、当晚数据不丢
      # --max-calls 4200 = 5000 小时帽 − 800 保底线：富集串行先跑完，README 是本小时
      # Core 唯一消费者（仅首窗可能继承富集的残小时，由响应头保底线兜底睡等），
      # 实测节奏 ~77 调/分 → 4200 ≈ 54 分钟，与 --max-minutes 60 匹配。
      # （月度全量校准 2026-11 起移 readme-monthly.yml：36k+ 实测 ≥10h 塞不进
      #   nightly 6h 窗——11-01 run#56 富集吃满窗口，README 月度被硬墙砍死、连
      #   提交步都跳过整晚丢失；nightly 从此恒 weekly，月初无模式切换）
      - name: README 增量（恒 weekly；月度全量校准在 readme-monthly.yml）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "README 模式: weekly"
          REM=$(( 360*60 - ($(date +%s) - JOB_T0) - 600 ))
          [ "$REM" -lt 300 ] && REM=300
          echo "README 本窗总预算 $(( REM / 60 )) 分钟"
          python collect/readme_sweep.py --mode weekly --pool data/snapshot_latest/pool.json \
            --max-calls 4200 --max-minutes 60 \
            --wait-windows 10 --max-total-minutes $(( REM / 60 )) \
            --limit "${{ github.event.inputs.limit || '0' }}"

      - name: 出池仓 absent_since 打戳（每晚，零侵入只写台账）
        run: |
          python tools/purge_outpool.py --stamp || echo "::warning::absent_since 打戳失败（不影响当晚采集数据）"

      - name: 出池仓清理 dry-run 清单（每月 1 号，人工过目后本地 --apply）
        run: |
          d=$(date -u +%d)
          if [ "$d" = "01" ]; then
            python tools/purge_outpool.py || echo "::warning::purge dry-run 失败（不影响当晚采集数据）"
          else
            echo "非月初，跳过"
          fi

      # M1 滚动归档：≥15 天的快照目录打包上 Releases（按月 archive-YYYY-MM），
      # 远端 digest 一致才删本地目录；失败只警告不阻断采集（次晚重试补漏，幂等）
      - name: 快照滚动归档（≥15 天 → Releases）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install zstandard >/dev/null
          python tools/release_archive.py rotate --apply || echo "::warning::滚动归档失败（次晚自动补漏）"
          rm -rf _archive_tmp

      # T5a 增量挂钩（2026-11-04）：evidence 各班（3h 一班+打满自愈重采）落地后
      # 当晚收口重判——新证据信号当天进回写结论；interpret 恢复后此步同时兜住
      # 夜间新解读重开的空适配黑洞。零 API ~10s 幂等；失败只警告不损采集数据。
      - name: 程序适配回写（evidence 增量后重判 + 补全率报表）
        run: |
          python attribution/writeback.py || echo "::warning::回写失败（不影响当晚采集数据）"
          {
            echo "## 归属补全率（T4b 程序适配回写）"
            python -c "import json; c=json.load(open('state/attribution_writes.json',encoding='utf-8'))['counts']; print(f\"- 入圈 {c['in_scope']} · 回写 dbs {c['fill']} · 打原因 {c['tag']} · 池内未解读 {c['pool_uninterpreted']}\")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交并推送数据
        run: |
          git config user.name "zqf20096327"
          git config user.email "zqf20096327@users.noreply.github.com"
          git add -A
          git commit -m "采集 $(date -u +%F\ %H:%M)" || { echo "无变更"; exit 0; }
          # 与 interpret(每 2h)推送可能撞车：重试+变基，最多 5 轮
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash >/dev/null 2>&1 || true
            git push && { echo "已推送"; exit 0; }
            echo "推送撞车，40s 后重试（$i/5）"; sleep 40
          done
          echo "::warning::推送 5 次未成功，本窗数据丢失（断点续采下窗重做）"
