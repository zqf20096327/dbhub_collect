name: nightly-interpret
on:
  # 2026-11-03 起定时暂定（用户指令）：①解读任务重构方案 v1.5 定稿在即——判定层
  # v4.3 将去掉 db 字段、dbs 改读时程序计算（11-01 裁定），旧 prompt 继续夜跑
  # 只会再产一批带旧 db 结论的记录白烧语料；②T4b 程序适配回写（739cda85）刚把
  # 12,028 空适配黑洞清零，夜跑重解读会重新翻开空记录。恢复条件：v1.5 新 prompt
  # 上线后连跑 golden_eval（[[golden-eval-gate]] 以最近 v3 基线为准）不退再开。
  # 手动入口保留——金标回归/补解读急件可随时 dispatch。
  # 2026-11-04 定时恢复（用户指令）：v4 判定卷已上线为默认模式（E1 落地+双模型
  # 验证 140 条零拒收；金标门槛按 11-03 退役口径=人工金标重建后回填）。
  schedule:
    - cron: '23 6,18 * * *'    # 一天两窗（UTC 06:23/18:23 = 北京 14:23/02:23）。
  #                           # 23 分错峰：整点 0 分是全网 cron 高峰会被 GitHub 丢弃
  #                           #（10-01/10-07 实测 12 窗只来 4-8 窗）。
  #                           # 语料空转稳态后 12 窗/天纯耗 Actions 分钟，10-30 降为 2 窗；
  #                           # 06:23 窗在 collect（16:00-22:00 UTC）之外，18:23 窗与其并行
  #                           # 不冲突（不同 API、不同 concurrency 组），
  #                           # 推送撞车由提交步骤的重试兜住。语料跑空后每窗 1 分钟即结束。
  workflow_dispatch:           # 手动触发（可勾选重试拒收 / 调批量，吃满单窗 6h）
    inputs:
      retry_rejected:
        description: '同时重试历史拒收项（同 sha 拒收也重跑）'
        type: boolean
        default: false
      max_items:
        description: '本次最多解读条数'
        type: number
        default: 50000
      mode:
        # 2026-11-08 收敛：v3/v2 已无旧缓存可续（G2 层化删除），选中=空缓存全量
        # 重烧旧通道，非回滚；如需真回滚走 pre-g2 tag + 备份恢复，不走 dispatch。
        description: '解析模式（v4=判定卷·最新，v4t=文本卷·头部）'
        type: choice
        options: [v4, v4t]
        default: v4
permissions:
  contents: write
concurrency:
  group: nightly-interpret     # 与采集互不干扰；自身重跑排队不互杀
  cancel-in-progress: false
jobs:
  interpret:
    runs-on: ubuntu-latest
    timeout-minutes: 355       # 单 job 上限 6h，留 5 分钟给提交
    steps:
      - uses: actions/checkout@v4

      - name: 记录 job 起点（算剩余时间预算）
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      # 2026-11-08 起 db_scan 步移除：v4 判定卷 cands={} 不投喂、v4t/desc/词控三
      # 层均不读 db_scan.json（下游 dbhub_page/dbhub_kb 亦无消费，已验证），唯一
      # 消费者 v3/v2 回滚模式已随旧缓存退役（G2 层化）。数据文件留在仓里不刷新。

      # 断点续跑：sha 缓存命中自动跳过；额度耗尽（1113）脚本自带窗口等待。
      # 定时窗预算 100min（给 db_scan 和提交留余量）；手动触发吃满 6h
      - name: AI 解读（v4 判定卷默认；dispatch 可切 v4t 文本卷）
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://open.bigmodel.cn/api/coding/paas/v4
          AI_MODEL: glm-5.3-flash
        run: |
          EXTRA=""
          [ "${{ github.event.inputs.retry_rejected }}" = "true" ] && EXTRA="--retry-rejected"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BUDGET=100; LIMIT=1200
          else
            REM=$(( 355*60 - ($(date +%s) - JOB_T0) - 600 ))
            [ "$REM" -lt 600 ] && REM=600
            BUDGET=$(( REM / 60 )); LIMIT="${{ github.event.inputs.max_items || 50000 }}"
          fi
          MODE="${{ github.event.inputs.mode || 'v4' }}"    # 1104 起：最新解析=v4 判定卷
          echo "本窗解读预算 ${BUDGET} 分钟 · 上限 ${LIMIT} 条 · 模式 ${MODE}"
          python interpret/interpret.py --mode "$MODE" --concurrency 4 \
            --max-items "$LIMIT" --max-minutes "$BUDGET" $EXTRA

      # 四层全覆盖（1108 起）：v4 主步之外，文本卷/desc/词控做增量补跑——定时窗与新
      # 仓从此四层都有覆盖（此前只有 v4 夜跑，新仓的 text/desc/词控无人写）。
      # continue-on-error：任一层失败只告警不拖死其他层与提交步（层内断点自会续跑）。
      - name: 文本卷增量（v4t·新仓补身份）
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'v4' }}
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://open.bigmodel.cn/api/coding/paas/v4
          AI_MODEL: glm-5.3-flash
        run: |
          python interpret/interpret.py --mode v4t --concurrency 4 \
            --max-items 400 --max-minutes 40

      - name: desc 降级层（无 README 新仓）
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'v4' }}
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://open.bigmodel.cn/api/coding/paas/v4
          AI_MODEL: glm-5.3-flash
        run: |
          python interpret/run_desc.py --concurrency 4 --max-minutes 10

      - name: domain_tags 词控层增量
        if: ${{ github.event.inputs.mode == '' || github.event.inputs.mode == 'v4' }}
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://open.bigmodel.cn/api/coding/paas/v4
          AI_MODEL: glm-5.3-flash
        run: |
          python interpret/run_domain_tags.py --concurrency 4 \
            --limit 400 --max-minutes 40

      # 与采集并行时推送可能撞车：重试 + 变基，最多 5 轮
      - name: 提交并推送状态
        run: |
          git config user.name "zqf20096327"
          git config user.email "zqf20096327@users.noreply.github.com"
          git add state/interp state/interp_state.json \
                  state/manual_review.json
          [ -d state/clean_delta_shards ] && git add state/clean_delta_shards \
                  || echo "::warning::clean_delta_shards 未生成（B1 落档缺失，解读本体不受影响）"
          git diff --cached --quiet && { echo "无变更"; exit 0; }
          git commit -m "解读 $(date -u +%F\ %H:%M) · 层条目 $(python -c "import sys;sys.path.insert(0,'lib');sys.path.insert(0,'interpret');from interp_layer_store import LayerStore;print(sum(len(LayerStore(l).load()) for l in ('judge','text','domain_tags','desc')))" 2>/dev/null || echo '?') 条" -q
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash >/dev/null 2>&1 || true
            git push && { echo "已推送"; exit 0; }
            echo "推送撞车，40s 后重试（$i/5）"; sleep 40
          done
          echo "::warning::推送 5 次未成功，本窗结果丢失（sha 未入库，下窗自动重解读）"
